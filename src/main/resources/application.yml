server:
  port: 8080

spring:
  application:
    name: dm-application
  output:
    ansi:
      enabled: ALWAYS
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 52MB
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
      region:
        static: ap-northeast-2
      s3:
        bucket: dm-bucket-v-1
  rag:
    ingest: false

langchain4j:
  open-ai:
    chat-model:
      api-key: ${GPT_API_KEY}
      model-name: gpt-4o-mini

custom:
  jwt:
    secretKey: ${JWT_SECRET_KEY}
  accessToken:
    expiration: "#{60 * 60 * 1000}"   # 1시간
  refreshToken:
    expiration: "#{60 * 60 * 24 * 7 * 1000}"   # 7일
