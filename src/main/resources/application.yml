server:
  port: 8080

spring:
  application:
    name: dm-application
  output:
    ansi:
      enabled: ALWAYS
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 52MB
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
      region:
        static: ap-northeast-2
      s3:
        bucket: dm-bucket-v-1
  rag:
    ingest: false

langchain4j:
  open-ai:
    chat-model:
      api-key: ${GPT_API_KEY}
      model-name: gpt-4o-mini
      log-requests: true
      log-responses: true

custom:
  jwt:
    secretKey: ${JWT_SECRET_KEY}
  accessToken:
    expiration: "#{365 * 24 * 60 * 60 * 1000}"   # 1년    앱 기준
  refreshToken:
    expiration: "#{365 * 7 * 24 * 60 * 60 * 1000}"   # 7년

oauth2:
  providers:
    google:
      clientId: 910298565199-1us9as4fejffov9q2e18kpco7l11lr13.apps.googleusercontent.com
    kakao:
      userInfoUri: https://kapi.kakao.com/v2/user/me
    naver:
      userInfoUri: https://openapi.naver.com/v1/nid/me
